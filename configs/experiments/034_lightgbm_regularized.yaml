experiment:
  name: 034_lightgbm_regularized
  purpose: lightgbm with parameters mirrored from the tuned catboost 001 and proper regularization

validation:
  strategy: kfold
  n_splits: 5

# Parameters mirror the tuned CatBoost 001 (iterations / learning_rate / depth /
# L2) so the CatBoost-vs-LightGBM comparison is fair. 033 showed that an
# un-regularized LightGBM overfits hard (CV 0.852 / Kaggle 0.778); the key
# change here is reg_lambda 1 -> 20, matching catboost l2_leaf_reg.
model:
  family: lightgbm
  params:
    n_estimators: 155
    learning_rate: 0.0314
    num_leaves: 16
    max_depth: 4
    min_child_samples: 20
    reg_lambda: 20
    subsample: 0.8
    subsample_freq: 1
    random_state: 42
    n_jobs: -1
    verbose: -1
