experiment:
  name: 001_best_solution
  purpose: current best solution

validation:
  strategy: kfold
  n_splits: 5

model:
  family: catboost

  params:
    iterations: 155
    learning_rate: 0.0314
    depth: 4
    l2_leaf_reg: 20
    random_strength: 5
    bagging_temperature: 1
    border_count: 32
    loss_function: Logloss
    eval_metric: Logloss
    custom_metric: Accuracy
    random_seed: 42
    verbose: false
    allow_writing_files: false

  fit_params:
    use_best_model: true
    early_stopping_rounds: 30
