experiment:
  name: 033_lightgbm
  purpose: lightgbm gradient boosting on the full feature set - second boosting for model comparison

validation:
  strategy: kfold
  n_splits: 5

# Same feature set as 001 (no drop) so this is an honest CatBoost-vs-LightGBM
# comparison. Not tuned: moderate, lightly regularized defaults — the goal is a
# second independent boosting, not a new leaderboard best.
model:
  family: lightgbm
  params:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 20
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    verbose: -1
