project:
  name: titanic_survival
  competition: titanic
  kaggle_url: https://www.kaggle.com/competitions/titanic
  seed: 42

paths:
  data_dir: data/raw
  train_file: train.csv
  test_file: test.csv
  sample_submission_file: gender_submission.csv
  reports_dir: reports
  submissions_dir: submissions

columns:
  id: PassengerId
  target: Survived

metric:
  name: accuracy

features:
  drop: []
  family_smoothing: 10.0

tuning:
  threshold:
    min: 0.35
    max: 0.65
    step: 0.01
  trial:
    iterations: 1500
    early_stopping_rounds: 100
