project:
  name: titanic_survival
  competition: titanic
  kaggle_url: https://www.kaggle.com/competitions/titanic
  seed: 42

paths:
  data_dir: data/raw
  train_file: train.csv
  test_file: test.csv
  sample_submission_file: gender_submission.csv
  reports_dir: reports
  submissions_dir: submissions

columns:
  id: PassengerId
  target: Survived

metric:
  name: accuracy

features:
  drop: []
  family_smoothing: 10.0

tuning:
  threshold:
    min: 0.35
    max: 0.65
    step: 0.01
  trial:
    iterations: 1500
    early_stopping_rounds: 100
  # Optuna search space, namespaced by model family — _objective picks its own.
  search_space:
    catboost:
      learning_rate: {type: float, min: 0.02, max: 0.1, log: true}
      depth: {type: int, min: 3, max: 6}
      l2_leaf_reg: {type: float, min: 1.0, max: 10.0, log: true}
      random_strength: {type: float, min: 0.0, max: 3.0}
      bagging_temperature: {type: float, min: 0.0, max: 1.0}
      border_count: {type: categorical, choices: [32, 64, 128]}
    mlp:
      learning_rate: {type: float, min: 0.0001, max: 0.01, log: true}
      dropout: {type: float, min: 0.1, max: 0.5}
      weight_decay: {type: float, min: 0.000001, max: 0.001, log: true}
      batch_size: {type: categorical, choices: [32, 64, 128]}
      hidden: {type: categorical, choices: ["32-16", "64-32", "128-64", "128-64-32"]}
      epochs: {type: int, min: 30, max: 80}
