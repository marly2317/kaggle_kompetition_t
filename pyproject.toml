[project]
name = "titanic-survival-pipeline"
version = "0.1.0"
description = "Kaggle Titanic."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "joblib>=1.3",
    "catboost>=1.2",
    "optuna>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
